
apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-lab-service
  labels:
    app: production-lab-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-lab-service
  template:
    metadata:
      labels:
        app: production-lab-service
    spec:
      containers:
        - name: production-lab-service
          image: production-lab-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
    
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
