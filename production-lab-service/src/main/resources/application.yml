# Base configuration: production-safe defaults shared by every environment.
# Any property can be overridden with an environment variable via Spring relaxed
# binding, e.g. server.tomcat.threads.max -> SERVER_TOMCAT_THREADS_MAX.

spring:
  application:
    name: production-lab-service
  lifecycle:
    # Max time to finish in-flight requests after SIGTERM. Keep it below the pod's
    # terminationGracePeriodSeconds (minus any preStop delay).
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  mvc:
    problemdetails:
      enabled: true  # RFC 9457 JSON error bodies

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    connection-timeout: 5s      # time allowed for the client to send the request after connecting
    keep-alive-timeout: 75s     # longer than typical proxy/ingress upstream keep-alive (60s) to avoid 502s
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness (auto-enabled on K8s, explicit here)
      show-details: never       # don't leak internals on an unauthenticated endpoint
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Explicit histogram buckets for http.server.requests, aligned with the delay endpoint's range.
      # A small, fixed bucket set keeps series count bounded while supporting histogram_quantile().
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2500ms,5s,10s

lab:
  delay:
    max-ms: ${LAB_DELAY_MAX_MS:5000}
  failure:
    # Lab-only. Must be enabled explicitly; never set to true in production.
    enabled: ${LAB_FAILURE_ENABLED:false}
